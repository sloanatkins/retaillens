name: RetailLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 ingestion/ dashboard/ \
            --max-line-length=120 \
            --exclude=__pycache__ \
            --ignore=E501,W503,E302,E305,F401,E402
